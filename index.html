    #info-panels { position: absolute; top: 10px; left: 10px; z-index: 1; max-width: 340px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 20px); }

    .info-panel h3 { margin: 0 0 8px; font-size: 15px; }
    .info-panel p { margin: 0 0 8px; color: #666; font-size: 12px; line-height: 1.4; }
    .info-panel a { color: #1a73e8; }

f heritage houses.<br><br><strong>Key features:</strong> Superior heritage interface with maximum buffer zone. Substantial pervious surface area and verified on-site canopy coverage. Vehicle access from Noone Street with optimal circulation geometry. Parking fully accommodated under building. Simpler vertical massing. Subject to AS5100 railway clearance risk assessment (building 12-14m from stabling siding centreline, deeper into 10-20m zone but still well clear of 10m threshold).<br><br><strong>Estimated yield:</strong> Approximately 95-105 dwellings (vs 114 proposed), maintaining a 3.2-3.5&times; multiplier over existing 30 units. Represents optimal balance between housing delivery and planning policy compliance with maximum amenity outcomes for residents and streetscape."}, "proposal-6m-south": {"buildings": [{"coords": [[144.99592285939156, -37.794014158810256], [144.99562867285962, -37.79398537662654], [144.9956154396165, -37.794070549663516], [144.99590962647827, -37.79409933188934]], "height": 14.3, "fill": "rgba(180, 100, 80, 1.0)", "stroke": "rgba(160, 80, 60, 1.0)"}, {"coords": [[144.99582350126704, -37.79409090577442], [144.99571532361614, -37.79408032205342], [144.99571122515903, -37.79410670110796], [144.9958194028475, -37.79411728483376]], "height": 26.5, "fill": "rgba(220, 210, 195, 1.0)", "stroke": "rgba(200, 190, 175, 1.0)"}, {"coords": [[144.99590968282084, -37.79409933740163], [144.99582350126704, -37.79409090577442], [144.9958194028475, -37.79411728483376], [144.99590558443123, -37.7941257164648]], "height": 6.45, "fill": "rgba(180, 100, 80, 1.0)", "stroke": "rgba(160, 80, 60, 1.0)"}, {"coords": [[144.99590558443123, -37.7941257164648], [144.99584036227873, -37.794119335419246], [144.9958183627783, -37.794260932843756], [144.99588358505238, -37.79426731390484]], "height": 9.675, "fill": "rgba(180, 100, 80, 1.0)", "stroke": "rgba(160, 80, 60, 1.0)"}, {"coords": [[144.9958514922663, -37.79426417409211], [144.9957912619581, -37.79425828140753], [144 946653468165], [144.99584688709535, -37.794666241021844], [144.99586998771522, -37.7946685010748]], "height": 1.0, "fill": "rgba(180, 100, 80, 1.0)", "stroke": "rgba(160, 80, 60, 1.0)"}, {"coords": [[144.99592308657992, -37.79432673575626], [144.99592297389447, -37.794326724731675], [144.99587001395952, -37.7946675958448], [144.99587012664546, -37.79466760686943]], "height": 1.0, "fill": "rgba(0, 0, 0, 0.7)", "stroke": "rgba(0, 0, 0, 0.9)"}, {"coords": [[144.99560019729117, -37.79461455412927], [144.99552807837358, -37.79460749817614], [144.9955113576129, -37.79471511572775], [144.9955834766327, -37.79472217169392]], "height": 0.01, "fill": "rgba(80, 80, 80, 1.0)", "stroke": "rgba(60, 60, 60, 1.0)"}, {"coords": [[144.99584036227873, -37.794119335419246], [144.9958183488853, -37.79426102226429], [144.99579124806505, -37.79425837082807], [144.99578289835242, -37.79431211256739], [144.99580999919183, -37.794314764006074], [144.99579231335616, -37.79442859634303], [144.99576521247616, -37.794425944899174], [144.99576011370846, -37.794458762231685], [144.9957872146002, -37.79446141367703], [144.99575676088756, -37.794657423464905], [144.99564257626864, -37.7946462520358], [144.9956489644009, -37.79460513648844], [144.99563093467083, -37.79460337251177], [144.99562454652877, -37.79464448805787], [144.99551036195538, -37.79463331650164], [144.9955636013712, -37.79429065718475], [144.9956808617399, -37.79430212965236], [144.99568496022172, -37.79427575060032], [144.99556769989374, -37.79426427813791], [144.995593965092, -37.79409522867886]], "height": 26.5, "fill": "rgba(210, 160, 140, 1.0)", "stroke": "rgba(190, 140, 120, 1.0)"}], "legend": "<div class=\"legend-item\"><span class=\"legend-swatch\" style=\"background:rgb(210,160,140)\"></span>Main tower (26.5m)</div>\n      <div class=\"legend-item\"><span class=\"legend-swatch\" style=\"background:rgb(180,100,80)\"></span>Podium (14.3m) / Street (9.675m, 6.45m)</div>\n      <div class=\"legend-item\"><span class=\"legend-swatch\" style=\"background:rgb(220,210,195)\"></span>Roof plant &amp; stairs</div>\n      <div class=\"legend-item\"><span class=\"legend-swatch\" style=\"background:rgb(80,80,80)\"></span>Car park (external overflow)</div>\n      <div class=\"legend-item\"><span class=\"legend-swatch\" style=\"background:rgb(0,120,255)\"></span>Lot boundary</div>", "geojson": "proposal-6m-south.geojson", "label": "Proposal with 6m south setback", "description": "<strong>Original proposal with 6m southern setback</strong> &mdash; identical to the submitted proposal but with the building pulled back 6m from the southern lot boundary (vs 0.5m in the original).<br><br><strong>Key changes:</strong> Tower length reduced from 65.7m to 60.2m to accommodate the larger southern setback. Street-facing southern mass shortened correspondingly. All other dimensions and positions unchanged.<br><br><strong>Estimated yield:</strong> Slightly reduced from the 114-dwelling proposal due to shortened floor plate. Improved southern boundary clearance for deep-soil planting and neighbour amenity."}};
    const FLAT_MAP_ID = "757278b5b147fdbb2e54430f";

    // Parse rgba string to [r,g,b,a] array for deck.gl
    function parseRgba(rgba) {
      const match = rgba.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
      if (!match) return [128, 128, 128, 200];
      return [
        parseInt(match[1]),
        parseInt(match[2]),
        parseInt(match[3]),
        Math.round((match[4] !== undefined ? parseFloat(match[4]) : 1) * 255)
      ];
    }

    async function init() {
      const { Map3DElement, Polygon3DElement, AltitudeMode, MapMode } = await google.maps.importLibrary("maps3d");

      // 3D map (full photorealistic) with Polygon3DElement
      const map3d = new Map3DElement({
        center: { ...CENTER, altitude: 80 },
        range: 200, tilt: 60, heading: 0, mode: MapMode.HYBRID,
        minAltitude: 0.1,
        maxAltitude: 1000,
        minTilt: 0,
        maxTilt: 90
      });
      map3d.style.width = map3d.style.height = "100%";
      document.getElementById("map3d").appendChild(map3d);

      let polygons3d = [];
      let overlay = null;
      const occludedCheckbox = document.getElementById("occluded");

      // Flat map setup (only if Map ID configured)
      let mapFlat = null;
      if (FLAT_MAP_ID && typeof deck !== "undefined") {
        mapFlat = new google.maps.Map(document.getElementById("mapFlat"), {
          center: { ...CENTER, lat: -37.794009 },
          zoom: 19,
          tilt: 60,
          heading: 0,
          mapId: FLAT_MAP_ID
        });
        overlay = new deck.GoogleMapsOverlay({ layers: [] });
        overlay.setMap(mapFlat);
      }

      function loadScenario(id) {
        const scenario = SCENARIOS[id];
        if (!scenario) return;

        // Remove existing 3D polygons
        for (const p of polygons3d) p.remove();
        polygons3d = [];

        // Create new 3D polygons
        const drawsOccluded = occludedCheckbox.checked;
        for (const b of scenario.buildings) {
          const poly = new Polygon3DElement({
            altitudeMode: AltitudeMode.ABSOLUTE,
            extruded: true,
            fillColor: b.fill,
            strokeColor: b.stroke,
            strokeWidth: 2,
            drawsOccludedSegments: drawsOccluded
          });
          poly.outerCoordinates = b.coords.map(([lng, lat]) => ({
            lat, lng, altitude: GROUND + b.height
          }));
          map3d.appendChild(poly);
          polygons3d.push(poly);
        }

        // Update deck.gl overlay
        if (overlay) {
          const deckData = scenario.buildings.map(b => ({
            polygon: b.coords.map(([lng, lat]) => [lng, lat]),
            height: b.height,
            fillColor: parseRgba(b.fill),
            strokeColor: parseRgba(b.stroke)
          }));
          overlay.setProps({
            layers: [new deck.PolygonLayer({
              id: "buildings",
              data: deckData,
              extruded: true,
              wireframe: true,
              getPolygon: d => d.polygon,
              getElevation: d => d.height,
              getFillColor: d => d.fillColor,
              getLineColor: d => d.strokeColor,
              getLineWidth: 2,
              pickable: true
            })]
          });
        }

        // Update legend, download link, and scenario description
        document.getElementById("legend").innerHTML = scenario.legend;
        document.getElementById("geojsonLink").href = scenario.geojson;
        document.getElementById("scenarioDesc").innerHTML = scenario.description;
      }

      // Initial load
      loadScenario("proposal");

      // Scenario switching
      document.getElementById("scenarioSelect").addEventListener("change", (e) => {
        loadScenario(e.target.value);
      });

      // View mode switching
      document.getElementById("viewMode").addEventListener("change", (e) => {
        const is3d = e.target.value === "3d";
        document.getElementById("map3d").classList.toggle("hidden", !is3d);
        document.getElementById("mapFlat").classList.toggle("hidden", is3d);
      });

      // Occlusion toggle (3D mode only)
      occludedCheckbox.addEventListener("change", (e) => {
        for (const p of polygons3d) p.drawsOccludedSegments = e.target.checked;
      });

      // Viewpoint buttons - calculate positions around lot centrepoint
      // Lot dimensions: 40.5m (E-W) × 80.9m (N-S)
      // Anchor is 1.4m south of lot north boundary, 2.55m west of lot east boundary
      // Lot centre from anchor: (2.55 - 20.25)m east, (1.4 - 40.45)m north = (-17.7, -39.05)m

      // Helper: offset lat/lng by metres (north positive, east positive)
      function offsetLatLng(lat, lng, northM, eastM) {
        const latOffset = northM / 111320; // metres per degree latitude
        const lngOffset = eastM / (111320 * Math.cos(lat * Math.PI / 180)); // metres per degree longitude
        return { lat: lat + latOffset, lng: lng + lngOffset };
      }

      // Calculate lot centrepoint (accounting for -5.8° rotation)
      const rotRad = -5.8 * Math.PI / 180;
      const eastOffset = -17.7, northOffset = -39.05; // from anchor in unrotated coords
      const eastRot = eastOffset * Math.cos(rotRad) - northOffset * Math.sin(rotRad);
      const northRot = eastOffset * Math.sin(rotRad) + northOffset * Math.cos(rotRad);
      const lotCentre = offsetLatLng(-37.794009, 144.995949, northRot, eastRot);

      // Viewpoint configuration
      const viewDistance = 100;
      const targetHeight = 25; // Height above ground to point at (metres)
      const defaultElevation = 40; // Default camera elevation (metres)
      let currentViewpoint = null;

      const viewpoints = {
        n:      { heading: 180, offsetNorth: viewDistance, offsetEast: 0 },
        ne:     { heading: 225, offsetNorth: viewDistance/Math.sqrt(2), offsetEast: viewDistance/Math.sqrt(2) },
        e:      { heading: 270, offsetNorth: 0, offsetEast: viewDistance },
        se:     { heading: 315, offsetNorth: -viewDistance/Math.sqrt(2), offsetEast: viewDistance/Math.sqrt(2) },
        s:      { heading: 0, offsetNorth: -viewDistance, offsetEast: 0 },
        sw:     { heading: 45, offsetNorth: -viewDistance/Math.sqrt(2), offsetEast: -viewDistance/Math.sqrt(2) },
        w:      { heading: 90, offsetNorth: 0, offsetEast: -viewDistance },
        nw:     { heading: 135, offsetNorth: viewDistance/Math.sqrt(2), offsetEast: -viewDistance/Math.sqrt(2) },
        center: { heading: 0, offsetNorth: 0, offsetEast: 0, tilt: 60, range: 150, elevation: 80 }
      };

      const elevationSlider = document.getElementById("elevationSlider");
      const tiltSlider = document.getElementById("tiltSlider");
      const elevationValue = document.getElementById("elevationValue");
      const tiltValue = document.getElementById("tiltValue");

      // Calculate tilt to point at targetHeight above ground from given elevation and distance
      // Tilt is angle from vertical: atan(horizontal_distance / vertical_difference)
      function calculateTilt(elevation, distance, target) {
        const verticalDiff = elevation - target;
        return Math.round(Math.atan(distance / verticalDiff) * 180 / Math.PI);
      }

      // Update camera from current viewpoint and slider values
      function updateCamera() {
        if (!currentViewpoint) return;
        const view = viewpoints[currentViewpoint];
        const elevation = parseInt(elevationSlider.value);
        const tilt = parseInt(tiltSlider.value);
        const viewPos = offsetLatLng(lotCentre.lat, lotCentre.lng, view.offsetNorth, view.offsetEast);

        map3d.center = {
          lat: viewPos.lat,
          lng: viewPos.lng,
          altitude: GROUND + elevation
        };
        map3d.heading = view.heading;
        map3d.tilt = tilt;
        map3d.range = view.range || viewDistance;
      }

      // Viewpoint button clicks
      document.querySelectorAll(".viewpoint-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentViewpoint = btn.dataset.view;
          const view = viewpoints[currentViewpoint];

          // Set elevation slider (use view-specific elevation if available)
          const elevation = view.elevation || defaultElevation;
          elevationSlider.value = elevation;
          elevationValue.textContent = elevation + "m";

          // Calculate and set tilt (use view-specific tilt if available)
          const tilt = view.tilt || calculateTilt(elevation, view.range || viewDistance, targetHeight);
          tiltSlider.value = tilt;
          tiltValue.textContent = tilt + "°";

          updateCamera();
        });
      });

      // Slider change events - update camera properties directly to retain current position
      elevationSlider.addEventListener("input", () => {
        const elevation = parseInt(elevationSlider.value);
        elevationValue.textContent = elevation + "m";

        // Update only the altitude, keeping current lat/lng
        const currentCenter = map3d.center;
        map3d.center = {
          lat: currentCenter.lat,
          lng: currentCenter.lng,
          altitude: GROUND + elevation
        };
      });

      tiltSlider.addEventListener("input", () => {
        const tilt = parseInt(tiltSlider.value);
        tiltValue.textContent = tilt + "°";

        // Update only the tilt
        map3d.tilt = tilt;
      });
    }

    window.onload = init;
  </script>
</body>
</html>
